<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StormShield AI | Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌪️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🌪️ StormShield AI</div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h2 id="form-title">Welcome Back</h2>
            <p id="form-subtitle">Sign in to access emergency features.</p>

            <form id="auth-form">
                <div class="input-group" id="name-group" style="display: none;">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Juan Dela Cruz">
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="juan@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">Sign In</button>
            </form>

            <p class="toggle-text">
                <span id="toggle-msg">Don't have an account?</span>
                <a href="#" id="toggle-auth">Sign Up</a>
            </p>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
